version: '3.8'

services:
  axonserver:
    image: axoniq/axonserver:4.5.13-jdk-17-dev
    container_name: axonserver
    environment:
      - AXON_SERVER_STANDALONE=true
    ports:
      - '8024:8024'
      - '8124:8124'
    volumes:
      - axonserver_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyinfDb-net
    restart: always

  pgvector:
    container_name: polyinfDb
    image: 'pgvector/pgvector:pg16'
    environment:
      - POSTGRES_DB=polyinfDb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
    volumes:
      - polyinfDb_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    networks:
      - polyinfDb-net
    restart: always

  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    ports:
      - '8088:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: kunet@gmail.com
      PGADMIN_DEFAULT_PASSWORD: kounet
    networks:
      - polyinfDb-net
    depends_on:
      - pgvector

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://polyinfDb:5432/polyinfDb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: 1234
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      pgvector:
        condition: service_started
    networks:
      - polyinfDb-net

  discoveryservice:
    build: ./discoveryservice
    image: discoveryservice
    container_name: discoveryservice
    ports:
      - '8761:8761'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - polyinfDb-net
    restart: always

  configservice:
    build: ./configservice
    image: configservice
    container_name: configservice
    ports:
      - '9999:9999'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 30s
    depends_on:
      discoveryservice:
        condition: service_healthy
      axonserver:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  commandeBlog:
    build: ./blogService/commandeBlog
    image: commandeblog
    container_name: commandeBlog
    ports:
      - '8081:8081'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
      - CONFIG_SERVICE_URL=http://configservice:9999
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/polyinformatiqueEcommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      configservice:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  queryBlog:
    build: ./blogService/queryBlog
    image: queryblog
    container_name: queryBlog
    ports:
      - '8082:8082'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
      - CONFIG_SERVICE_URL=http://configservice:9999
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/polyinformatiqueEcommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      commandeBlog:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  gatewayservice:
    build: ./getwayservice
    image: gatewayservice
    container_name: gatewayservice
    ports:
      - '8888:8888'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
      - CONFIG_SERVICE_URL=http://configservice:9999
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/polyinformatiqueEcommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      axonserver:
        condition: service_healthy
      configservice:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  ecPolyCommand:
    build: ./ecommercePolyinformatique/ecPolyCommand
    image: ecpolycommand
    container_name: ecPolyCommand
    ports:
      - '8083:8083'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
      - CONFIG_SERVICE_URL=http://configservice:9999
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/polyinformatiqueEcommerce
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      configservice:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  ecPolyQuery:
    build: ./ecommercePolyinformatique/ecPolyQuery
    image: ecpolyquery
    container_name: ecPolyQuery
    ports:
      - '8084:8084'
    environment:
      - DISCOVERY_SERVICE_URL=http://discoveryservice:8761/eureka
      - CONFIG_SERVICE_URL=http://configservice:9999
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/polyinformatiqueEcommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      ecPolyCommand:
        condition: service_healthy
    networks:
      - polyinfDb-net
    restart: always

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    networks:
      - polyinfDb-net
    restart: always

  stripe:
    build: ./stripe
    container_name: stripe
    environment:
        VAULT_ADDR: http://vault:8200
        VAULT_TOKEN: root
    ports:
        - "8089:8080"
    depends_on:
        - vault
        - ecPolyCommand
    networks:
        - polyinfDb-net
    restart: unless-stopped


volumes:
  polyinfDb_data:
  axonserver_data:
  vault_data:

networks:
  polyinfDb-net:
    driver: bridge
