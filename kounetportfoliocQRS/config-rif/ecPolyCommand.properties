# Stripe Configuration for ecPolyCommand service
# These properties will be loaded by the StripeConfigProperties class

# Stripe API Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.api.secretKey=${STRIPE_SECRET_KEY:sk_test_placeholder}

# Stripe Webhook Configuration
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# Database Configuration
spring.datasource.url=jdbc:postgresql://polyinfDb:5432/polyinfDb
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.example.ecpolycommand.service.imple.StripeServiceImpl=DEBUG
logging.level.com.stripe=DEBUG
