<div class="page-title light-background">
  <div class="container">
    <nav class="breadcrumbs">
      <ol>
        <li><a href="/">Accueil</a></li>
        <li><a href="/categories">Catégories</a></li>
        <li class="current">Créer une catégorie</li>
      </ol>
    </nav>
    <h1>Créer une catégorie</h1>
  </div>
</div>

<section class="register section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Nouvelle Catégorie</h2>

            <!-- Messages de statut -->
            <div *ngIf="message.text" 
                 [class]="'alert alert-dismissible fade show ' + (message.type === 'success' ? 'alert-success' : 'alert-danger')" 
                 role="alert">
              <i [class]="'me-2 ' + (message.type === 'success' ? 'bi bi-check-circle' : 'bi bi-exclamation-triangle')"></i>
              {{ message.text }}
              <button type="button" class="btn-close" (click)="clearMessages()"></button>
            </div>

            <!-- Formulaire -->
            <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" novalidate>
              
              <!-- Nom de la catégorie -->
              <div class="mb-3">
                <label for="name" class="form-label">Nom de la catégorie *</label>
                <input 
                  type="text" 
                  class="form-control"
                  [class.is-invalid]="name?.invalid && name?.touched"
                  [class.is-valid]="name?.valid && name?.touched"
                  id="name" 
                  formControlName="name"
                  placeholder="Entrez le nom de la catégorie">
                
                <div *ngIf="name?.invalid && name?.touched" class="invalid-feedback">
                  <div *ngIf="name?.errors?.['required']">Le nom est requis</div>
                  <div *ngIf="name?.errors?.['minlength']">Le nom doit contenir au moins 2 caractères</div>
                </div>
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea 
                  class="form-control" 
                  id="description" 
                  formControlName="description"
                  rows="3"
                  placeholder="Description optionnelle de la catégorie">
                </textarea>
              </div>

              <!-- Boutons -->
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button 
                  type="button" 
                  class="btn btn-secondary me-md-2"
                  [routerLink]="['/categories']">
                  Annuler
                </button>
                <button 
                  type="submit" 
                  class="btn btn-primary"
                  [disabled]="loading || categoryForm.invalid">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'Création...' : 'Créer la catégorie' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
