<mat-card class="example-card" *ngFor="let prod of likedProductSizeDTOs">
  <!-- Header -->
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ prod.product?.name || 'Produit' }}</mat-card-title>
    <mat-card-subtitle>Taille : {{ prod.sizeProd || 'N/A' }}</mat-card-subtitle>
  </mat-card-header>

  <!-- Image -->
  <img
    mat-card-image
    [src]="prod.frontUrl || 'assets/img/placeholder.png'"
    alt="Photo du produit"
    class="product-image"
  />

  <!-- Contenu -->
  <mat-card-content>
    <p>{{ prod.product?.description || 'Aucune description.' }}</p>
    <p>
      Prix : <strong>{{ prod.price | currency : 'CAD' }}</strong>
    </p>
  </mat-card-content>

  <!-- Actions -->
  <mat-card-actions>
    <button mat-button (click)="viewProduct(prod.id)">VOIR</button>
    <button mat-button color="warn" (click)="unlike(prod.id)">❌ Retirer le like</button>
  </mat-card-actions>

  <!-- Arbre de partage -->
  <mat-card-content>
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="share-tree">
      <!-- Noeud parent -->
      <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
        <button
          mat-icon-button
          matTreeNodeToggle
          [attr.aria-label]="'Toggle ' + node.name"
        >
          <mat-icon>
            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
          </mat-icon>
        </button>
        <span class="tree-node-label">{{ node.name }}</span>
      </mat-tree-node>

      <!-- Noeud feuille (bouton de partage) -->
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button
          mat-icon-button
          (click)="partage(node.reseau, prod)"
          [attr.aria-label]="node.name"
        >
          <ng-container *ngIf="node.icon; else genericIcon">
            <img [src]="'assets/icons/' + node.icon" alt="{{node.name}}" width="20" height="20" />
          </ng-container>
          <ng-template #genericIcon>
            <mat-icon>share</mat-icon>
          </ng-template>
        </button>
        <span class="tree-node-label">{{ node.name }}</span>
      </mat-tree-node>
    </mat-tree>
  </mat-card-content>
</mat-card>
