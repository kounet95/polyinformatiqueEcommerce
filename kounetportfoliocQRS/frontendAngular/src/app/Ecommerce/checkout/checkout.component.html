<!-- Le container principal de checkout -->
<div class="checkout-container">
  <!-- STEPPER -->
  <div class="checkout-steps">
    <div class="step" [class.active]="step === 1" [class.completed]="step > 1">
      <span>1</span>
      <div>Information</div>
    </div>
    <div class="line"></div>
    <div class="step" [class.active]="step === 2" [class.completed]="step > 2">
      <span>2</span>
      <div>Shipping</div>
    </div>
    <div class="line"></div>
    <div class="step" [class.active]="step === 3" [class.completed]="step > 3">
      <span>3</span>
      <div>Payment</div>
    </div>
    <div class="line"></div>
    <div class="step" [class.active]="step === 4">
      <span>4</span>
      <div>Review</div>
    </div>
  </div>

  <div class="checkout-main">
    <!-- Step 1: Customer Info -->
    <div *ngIf="step === 1">
      <h2>Customer Information</h2>
      <p class="form-desc">Please enter your contact details</p>
      <form>
        <div class="form-row">
          <input class="form-input" placeholder="First Name" [(ngModel)]="customer.firstname" name="firstname" required />
          <input class="form-input" placeholder="Last Name" [(ngModel)]="customer.lastname" name="lastname" required />
        </div>
        <input class="form-input" placeholder="Your Email" [(ngModel)]="customer.email" name="email" required />
        <input class="form-input" placeholder="Your Phone Number" [(ngModel)]="customer.phone" name="phone" />

        <!-- Mode commande -->
        <div class="order-mode-select">
          <label>
            <input type="radio" name="orderMode" [(ngModel)]="orderMode" value="CART" /> Classic Order
          </label>
          <label>
            <input type="radio" name="orderMode" [(ngModel)]="orderMode" value="CUSTOMER" /> Custom Order
          </label>
        </div>

        <!-- Champs custom si CUSTOM -->
        <div *ngIf="orderMode === 'CUSTOMER'" class="custom-order-info">
          <input class="form-input" placeholder="Supplier ID" [(ngModel)]="customSupplierId" name="supplierId" required />
          <textarea class="form-input" placeholder="Describe your custom order" [(ngModel)]="customDescription" name="description"></textarea>
        </div>

        <button type="button" class="btn main-btn" (click)="nextStep()">Suivant</button>
      </form>
    </div>

    <!-- Step 2: Shipping -->
    <div *ngIf="step === 2">
      <h2>Shipping Address</h2>
      <p class="form-desc">Where should we deliver your order?</p>
      <div *ngIf="addresses.length > 0" class="existing-address-select">
        <select class="form-input" [(ngModel)]="selectedAddressId" name="selectedAddress">
          <option *ngFor="let addr of addresses" [value]="addr.id">
            {{ addr.street }}, {{ addr.city }}
          </option>
        </select>
      </div>
      <form>
        <input class="form-input" placeholder="Street Address" [(ngModel)]="shippingAddress.street" name="street" required />
        <input class="form-input" placeholder="Apartment, Suite, etc. (optional)" [(ngModel)]="shippingAddress.appartment" name="apartment" />
        <div class="form-row">
          <input class="form-input" placeholder="City" [(ngModel)]="shippingAddress.city" name="city" required />
          <input class="form-input" placeholder="State" [(ngModel)]="shippingAddress.state" name="state" />
          <input class="form-input" placeholder="ZIP Code" [(ngModel)]="shippingAddress.zip" name="zip" required />
        </div>
        <select class="form-input" [(ngModel)]="shippingAddress.country" name="country" required>
          <option value="">Select Country</option>
          <option value="France">France</option>
          <option value="USA">USA</option>
        </select>
        <div class="form-actions">
          <button type="button" class="btn secondary-btn" (click)="prevStep()">Back to Information</button>
          <button type="button" class="btn main-btn" (click)="nextStep()">Suivant</button>
        </div>
      </form>
    </div>

    <!-- Step 3: Payment -->
    <div *ngIf="step === 3">
      <h2>Payment Method</h2>
      <p class="form-desc">Choose how you'd like to pay</p>
      <form>
        <!-- Ajoute ici tes champs de paiement Stripe ou autre -->
        <input class="form-input" placeholder="Name on Card" [(ngModel)]="payment.name" name="paymentName" required />
        <div class="form-actions">
          <button type="button" class="btn secondary-btn" (click)="prevStep()">Retour</button>
          <button type="button" class="btn main-btn" (click)="nextStep()">Review Order</button>
        </div>
      </form>
    </div>

    <!-- Step 4: Review & Place Order -->
    <div *ngIf="step === 4">
      <h2>Review Your Order</h2>
      <p class="form-desc">Please review your information before placing your order</p>
      <div class="review-block">
        <!-- Affiche ici le résumé de la commande -->
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary-btn" (click)="prevStep()">Retour</button>
        <button type="button" class="btn main-btn" (click)="payer()" [disabled]="loading">
          {{ loading ? 'Processing...' : 'Place Order' }}
        </button>
      </div>
      <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
    </div>
  </div>
</div>
